<!DOCTYPE html>
<html lang="es" data-direccion="b">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha del socio · Gimnasio Pro</title>
  <meta name="theme-color" content="#b2452a">
  <link rel="icon" href="/iconos/gimnasio-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/estilos/tokens.css">
  <link rel="stylesheet" href="/estilos/base.css">
  <script src="/js/comun/presentacion.js"></script>
  <link rel="stylesheet" href="/estilos/ficha.css">
  <script type="module" src="/js/ficha.js"></script>
</head>
<body>
<header class="cabecera">
  <a class="cabecera-marca" href="/">Gimnasio Pro</a>
  <nav aria-label="Secciones"><script src="/js/comun/menu.js"></script></nav>
  <p class="cabecera-demo" data-demo hidden>Datos ficticios · se reinician cada día</p>
  <span class="cabecera-efectos" data-lugar-efectos></span>
  <button type="button" data-cerrar>Cerrar sesión</button>
</header>
<main class="hoja">
  <p class="rotulo">Ficha</p>
  <h1 data-titulo>Ficha del socio</h1>
  <p data-estado role="status">Cargando ficha del socio…</p>
  <p data-error role="alert"></p>
  <button type="button" data-reintentar hidden>Reintentar</button>
  <nav class="ficha-indice" aria-label="Partes de la ficha">
    <a href="#ficha-personales">Datos personales</a>
    <a href="#ficha-consentimientos">Consentimiento</a>
    <a href="#ficha-salud">Salud</a>
    <a href="#ficha-perfil">Perfil</a>
    <a href="#ficha-membresia">Membresía y pagos</a>
    <a href="#ficha-consultas">Consultas y descarga</a>
  </nav>
  <section id="ficha-personales" data-personales hidden aria-label="Datos personales"></section>
  <section id="ficha-consentimientos" data-consentimientos hidden aria-label="Consentimiento de salud"></section>
  <section id="ficha-consultas" data-consultas-ficha hidden aria-label="Consultas de ficha y descarga de datos"></section>
  <section id="ficha-salud" data-salud hidden aria-label="Salud"></section>
  <section id="ficha-perfil" data-perfil hidden aria-label="Perfil de entrenamiento"></section>
  <section id="ficha-membresia" data-membresia-pagos hidden aria-label="Membresía y pagos"></section>
</main>
</body>
</html>
