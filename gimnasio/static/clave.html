<!DOCTYPE html>
<html lang="es" data-direccion="b">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cambiar clave · Gimnasio Pro</title>
  <meta name="theme-color" content="#b2452a">
  <link rel="icon" type="image/png" href="/iconos/gimnasio-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/estilos/tokens.css">
  <link rel="stylesheet" href="/estilos/base.css">
  <script type="importmap">
    {
      "imports": {
        "@comun/": "/js/comun/"
      }
    }
  </script>
  <script type="module" src="/js/clave.js"></script>
</head>
<body><main><h1>Cambiar clave provisional</h1>
<p>Elegí una clave de al menos 10 caracteres para continuar.</p>
<form><label>Clave actual <input type="password" name="clave_actual" autocomplete="current-password" required></label>
<label>Clave nueva <input type="password" name="clave_nueva" autocomplete="new-password" minlength="10" required></label>
<button type="submit">Cambiar clave</button></form><p data-resultado role="status"></p><button type="button" data-salir>Cerrar sesión</button>
</main></body></html>
