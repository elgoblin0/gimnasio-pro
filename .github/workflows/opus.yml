name: Opus

# Opus decide los necesita-criterio y revisa el diff de los PR que tocan rutas sensibles.
# Corre con la suscripción del dueño (CLAUDE_CODE_OAUTH_TOKEN) y un tope de turnos por corrida.
# Etiqueta y comenta con CADENA_TOKEN para que la cadena reaccione.
# Solo lo disparan etiquetas, que únicamente pone quien tiene permiso de escritura.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: opus
  cancel-in-progress: false

jobs:
  criterio:
    if: github.event_name == 'issues' && github.event.label.name == 'necesita-criterio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.CADENA_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Sos Opus en Gimnasio Pro. Leé AGENTS.md y docs/protocolo-agentes.md, y después el issue
            con sus comentarios (`gh issue view ${{ github.event.issue.number }} --comments`).
            Resolvé la duda marcada con necesita-criterio:
            1. Decidí con VISION.md, GLOSSARY.md y docs/adr/. Leé solo lo que la duda necesita.
            2. Comentá la decisión en el issue, en concreto, para que Codex la aplique sin decidir.
               Si cambia la especificación, editá el cuerpo del issue.
            3. Si la decisión no está cubierta por un ADR, abrí un PR aparte con un ADR provisional, en una rama
               `opus/adr-NNNN-tema` que toque solo `docs/adr/` y `GLOSSARY.md` (la cadena lo fusiona sola).
            4. Quitá `necesita-criterio` y poné `estado:listo`.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 25
            --allowedTools "Bash(gh:*),Bash(git:*),Read,Edit,Write,Glob,Grep"

  revisar:
    if: >-
      github.event_name == 'pull_request' && github.event.label.name == 'revisado:codex' &&
      startsWith(github.event.pull_request.head.ref, 'codex/issue-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Toca rutas sensibles?
        id: sensible
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$PR" --repo "${{ github.repository }}" --name-only \
            | grep -qE '^(gimnasio/reglas/|migraciones/|gimnasio/comun/migrar\.py|gimnasio/permisos/|gimnasio/salud/)'; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sensible.outputs.si == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR: #${{ github.event.pull_request.number }}

            Sos Opus en Gimnasio Pro y revisás un PR que toca rutas sensibles (AGENTS.md).
            Leé solo el diff (`gh pr diff ${{ github.event.pull_request.number }}`), el issue que cierra
            y los ADR que el diff toca. No leas el repo entero.
            - Si está bien: poné la etiqueta `revisado:opus` en el PR.
            - Si no: dejá una revisión con hallazgos concretos y accionables y poné `correccion-pendiente`
              en el PR, sin quitar `revisado:codex`. La cadena se lo pasa a Codex.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 15
            --allowedTools "Bash(gh:*),Read,Glob,Grep"
