name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          set +e
          { ruff check . --output-format concise; ruff format --check .; } > ruff.txt 2>&1
          estado=$?
          python scripts/mapa_capacidades.py --verificar >> ruff.txt 2>&1 || estado=1
          if [ -d gimnasio/static/js ]; then node --test gimnasio/static/js >> ruff.txt 2>&1 || estado=1; fi
          cat ruff.txt
          exit $estado
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calidad
          path: ruff.txt

  pruebas:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: solo-ci
          MYSQL_DATABASE: gimnasio_pro
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psolo-ci"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      GIMNASIO_BD_HOST: 127.0.0.1
      GIMNASIO_BD_PUERTO: "3306"
      GIMNASIO_BD_USUARIO: root
      GIMNASIO_BD_CLAVE: solo-ci
      GIMNASIO_BD_NOMBRE: gimnasio_pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migraciones sobre base vacía
        run: |
          python -m gimnasio.comun.migrar
          python -m gimnasio.comun.migrar --sin-pendientes
      - name: pytest
        run: pytest --junitxml=reporte-pytest.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas
          path: reporte-pytest.xml

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resumen:
    if: always() && github.event_name == 'pull_request'
    needs: [calidad, pruebas, secretos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
      - name: Resumen compacto para agentes
        env:
          RESULTADOS: >-
            calidad=${{ needs.calidad.result }}
            pruebas=${{ needs.pruebas.result }}
            secretos=${{ needs.secretos.result }}
        run: |
          python scripts/resumen_ci.py artefactos $RESULTADOS > resumen-ci.md
          cat resumen-ci.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar en el PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file resumen-ci.md --edit-last --create-if-none
