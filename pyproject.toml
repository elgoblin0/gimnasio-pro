[project]
name = "gimnasio-pro"
version = "0.0.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["static/", "gimnasio/static/", "prototipos/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "bd: necesita MySQL (variables GIMNASIO_BD_*); se salta si no están",
    "e2e: recorrido de punta a punta; necesita MySQL y Chromium",
]
