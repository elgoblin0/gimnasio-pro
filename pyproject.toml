[project]
name = "gimnasio-pro"
version = "0.0.0"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["static/", "gimnasio/static/", "prototipos/"]

[tool.ruff.format]
# app.py es heredado y sus líneas están citadas en INDICADORES.md: no se reformatea.
exclude = ["app.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# app.py es el código heredado de la versión básica; se reemplaza en la etapa 1.
"app.py" = ["E501", "SIM", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "bd: necesita MySQL (variables GIMNASIO_BD_*); se salta si no están",
]
