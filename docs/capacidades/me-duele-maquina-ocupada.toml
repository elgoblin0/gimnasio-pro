# Dolor reportado y máquina ocupada con sustituciones, explicación y recarga.
# Exige consentimiento de salud para guardar dolores; un dolor ajeno al ejercicio
# conserva la equivalencia de zonas por máquina ocupada (pruebas/test_entrenamiento_api.py).
# El dolor posterior conserva en el tope semanal las subas con series realizadas;
# las anuladas antes de realizarlas no cuentan (pruebas/test_entrenamiento_api.py).
# Cada dolor en vivo deja su aviso sin duplicarlo al reintentar; las alternativas
# con zonas excluidas explican y guardan el motivo dolor_reportado. La propuesta
# lee los dolores en conjunto y no agrega consultas por cada sesión del historial.
# La recarga conserva nombre, medidas y series de la sustitución vigente aunque
# su alternativa salga del catálogo; las sustituciones se leen en una sola consulta
# (test_recarga_sustitucion_sin_alternativa_en_catalogo en pruebas/test_entrenamiento_api.py).
